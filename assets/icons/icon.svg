<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
  aria-label="game-center">
  <!-- The cabinet from the landing page, at icon size: dark shell, glowing
       screen, one amber marquee bulb. Drawn rather than photographed so it
       stays sharp at every size a launcher asks for. -->
  <rect width="512" height="512" rx="96" fill="#06081a" />
  <rect x="88" y="72" width="336" height="80" rx="28" fill="#161a35" />
  <circle cx="164" cy="112" r="18" fill="#ffd93d" />
  <circle cx="256" cy="112" r="18" fill="#ff5d8f" />
  <circle cx="348" cy="112" r="18" fill="#7ee7ff" />
  <rect x="88" y="184" width="336" height="216" rx="32" fill="#141834"
    stroke="#2b3160" stroke-width="12" />
  <rect x="128" y="224" width="256" height="136" rx="16" fill="#06081a" />
  <!-- A blocky "GC" in the screen, in the marquee's amber. -->
  <path
    d="M215 258h-44a20 20 0 0 0-20 20v28a20 20 0 0 0 20 20h44v-40h-24v-12h44v-16a20 20 0 0 0-20-20z"
    fill="#ffd93d" />
  <path
    d="M341 258h-44a20 20 0 0 0-20 20v28a20 20 0 0 0 20 20h44v-24h-40v-20h40z"
    fill="#7ee7ff" />
  <rect x="152" y="424" width="208" height="24" rx="12" fill="#2b3160" />
</svg>
