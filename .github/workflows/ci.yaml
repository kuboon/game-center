name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
      - run: deno task check
      - run: deno task bundle
      - run: deno task test
      # The SDK is published to JSR, which enforces rules `deno check` does not
      # — a missing return type in the public API stops a release. Catching it
      # on the PR beats finding out at publish time.
      - run: deno publish --dry-run
        working-directory: packages/sdk

  # A migration that has been applied cannot be edited: the runner records a
  # checksum for each one and refuses to continue when the file changes
  # underneath it. The tests never catch this, because they build a database
  # from nothing every time — so CI goes green and only the deploy turns red.
  # This job is the part that notices.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse edits to migrations already on the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          edited=$(git diff --name-only --diff-filter=MDR "$BASE"...HEAD -- db/migrations/)
          if [ -z "$edited" ]; then
            echo "No migration on the base branch was touched."
            exit 0
          fi

          echo "These migrations already exist on the base branch:"
          echo "$edited" | sed 's/^/  /'
          echo

          # Rewriting the whole set is a real thing to want, exactly once, while
          # every database that has applied them can still be thrown away. It
          # has to be said out loud in a commit message, because the cost is
          # paid by whoever forgets to rebuild those databases.
          reason=$(git log --format=%B "$BASE"..HEAD | sed -n 's/^Migrations-Reset:[[:space:]]*//p' | head -1)
          if [ -n "$reason" ]; then
            echo "Allowed by a Migrations-Reset trailer: $reason"
            echo
            echo "Every database that has applied these must be rebuilt, or its"
            echo "next migrate will stop at 'drifted' / 'missing'."
            exit 0
          fi

          echo "Editing one breaks any database that has already applied it"
          echo "(Migration checksum drift detected ...). Add a new migration"
          echo "that corrects the old one instead. See db/README.md."
          echo
          echo "If you really mean to rewrite the set, say so in a commit:"
          echo "  Migrations-Reset: <why, and which databases you will rebuild>"
          exit 1
